name: Deploy to Droplet

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 170.64.143.32
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /root/growthngen-caller
            git pull
            pm2 restart growthngen-caller
            echo "Deployed $(git log --oneline -1)"
