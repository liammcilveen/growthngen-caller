# GrowthNGen Caller — Nginx reverse proxy config
# Deploy to: /etc/nginx/sites-available/growthngen-caller
# Enable with: ln -s /etc/nginx/sites-available/growthngen-caller /etc/nginx/sites-enabled/
#
# Replace A-B-C-D with your Droplet IP (hyphens, not dots) e.g. 143-198-45-67
# Then run: certbot --nginx -d A-B-C-D.sslip.io

server {
    listen 80;
    server_name A-B-C-D.sslip.io;

    # Certbot will manage this block after: certbot --nginx -d A-B-C-D.sslip.io
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name A-B-C-D.sslip.io;

    # Certbot will fill these in
    ssl_certificate /etc/letsencrypt/live/A-B-C-D.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/A-B-C-D.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Increase body size for webhook payloads (transcripts can be large)
    client_max_body_size 2M;

    # Timeouts — post-call responds immediately, but ElevenLabs tool calls need headroom
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
